summary:
  types:
  - oauth2
  - http
  model: >-
    OAuth 2.0 client_credentials. The caller exchanges a client id and secret for a short-lived
    JWT access token, then presents it as an HTTP Bearer token on every subsequent call. Keys and
    secrets are self-managed by the payer/aggregator in the Interchecks Portal Developer area.
  token_lifetime_seconds: 900
  token_format: JWT
schemes:
- name: sec0
  type: oauth2
  flow: clientCredentials
  token_endpoint: https://prod.api.interchecks.io/api/v2/oauth2/token
  sandbox_token_endpoint: https://test.api.interchecks.io/api/v2/oauth2/token
  operation_id: get-access-token
  client_authentication: >-
    HTTP Basic — Authorization header carrying base64(clientId:secret).
  grant_type: client_credentials
  request_content_type: application/x-www-form-urlencoded
  response_fields:
  - access_token
  - expires_in
  - token_type
  scopes: []
  scopes_note: >-
    The published securityScheme declares no scopes and the documentation defines no scope or
    permission vocabulary. Authorization is scoped by the payer_id in the request path and by the
    payer/aggregator configuration held by Interchecks, not by OAuth scopes. No scopes/ artifact
    is emitted for this provider.
  sources:
  - openapi/interchecks-payments-api-v2.json
  - https://docs-v2.interchecks.com/reference/get-access-token
- name: httpBearer
  type: http
  scheme: bearer
  bearer_format: JWT
  note: >-
    The older published document (payments-api-v2.json, OpenAPI 3.0.0) declares the same
