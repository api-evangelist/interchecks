  sources:
  - openapi/interchecks-payments-api-v2-registry.json
tenancy:
  path_parameter: payer_id
  note: >-
    Every business operation is addressed under /api/v2/{payer_id}/..., where payer_id identifies
    the aggregator or the payer. An aggregator-level API account acts across its payers.
additional_controls:
- name: Payload envelope encryption
  header: 'X-ENCRYPTED: <Payer ID>'
  description: >-
    Optional per-payer envelope encryption of request and response bodies. Payload is encrypted
    with AES (AES/GCM/NoPadding by default, AES/CBC/PKCS5Padding via X-AES-MODE:
    CBC_PKCS5PADDING); the AES key and IV are encrypted with the counterparty RSA public key
    using RSA/ECB/OAEPPadding with SHA-256 OAEP and SHA-256 MGF1. Interchecks publishes its
    public key in PEM or JWK form via get-encryption-public-key.
  docs: https://docs-v2.interchecks.com/docs/encrypted-requests
- name: Webhook signature verification
  header: x-verification
  description: >-
    Inbound webhooks carry an RS256 JWT in the x-verification header whose payload holds iat and
    request_body_sha256_hash. The verifying public key is fetched by kid from
    /api/v2/{payer_id}/webhooks/get_validation_key/{kid}. Webhooks older than 5 minutes should be
    rejected.
  docs: https://docs-v2.interchecks.com/docs/webhooks
