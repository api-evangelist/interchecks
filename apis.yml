aid: interchecks
name: Interchecks
description: >-
  Interchecks Technologies, Inc. is a US instant-payments platform that moves money in both
  directions for payers who need to fund accounts and pay out to consumers at scale. Its Payments
  API v2 is a REST contract covering recipient onboarding and TIN verification, destination account
  management across bank (Plaid-linked), debit card, PayPal, Venmo and prepaid rails, immediate
  disbursement transactions across ACH standard/same-day, ACH Funding Plus, RTP, Instant Deposit
  (Visa/Mastercard OCT), Instant Funding (AFT), paper check, eCheck and prepaid, plus embeddable
  widgets, settlement and activity reporting, envelope-encrypted payloads and signed webhooks. The
  company reports more than $50 billion processed over ten years for online gaming and prediction
  markets, on-demand payroll, lending and digital banking clients, and publishes PCI DSS Level 1
  Service Provider and SOC 2 Type 2 attestations.
