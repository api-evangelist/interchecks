apis:
- name: Interchecks Payments API v2
  description: >-
    REST API for creating and managing recipients, destination payment accounts (bank, card,
    PayPal, Venmo, prepaid), payments accepted in the Recipient Portal or a hosted widget, and
    transactions for immediate disbursement or funding across ACH, RTP, card OCT/AFT, check,
    eCheck and prepaid rails. Authentication is OAuth 2.0 client_credentials returning a
    short-lived JWT bearer token; writes accept an Idempotency-Key header.
  humanURL: https://docs-v2.interchecks.com/docs/getting-started
  baseURL: https://prod.api.interchecks.io
