note: >-
  Interchecks documents that HTTP 429 "Too many requests in a given amount of time" can be
  returned, but publishes no numeric limit, no window, no burst allowance and no per-key,
  per-account or per-endpoint scope. No RateLimit-*, X-RateLimit-* or Retry-After response header
  is documented anywhere in the reference, and the published OpenAPI declares no 429 response on
  any of its 68 operations, so an agent has neither a documented budget nor a runtime signal to
  back off against. The one throttle-adjacent limit that IS published is a request-size bound
  rather than a rate: get-user-activity-report enforces a maximum 31-day date range.
