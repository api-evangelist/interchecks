- subject: ACH Funding retry
  bound: >-
    Not a rate limit, but a provider-side retry budget — R01 returns on ACH_FUNDING_PLUS are
    automatically retried at a configured interval until ERR_ACH_RETRY_ATTEMPTS_EXHAUSTED.
- subject: Webhook delivery retry
  bound: >-
    Outbound only — a non-2xx webhook response is retried twice within 15 seconds, then the cycle
    repeats within the next 2 hours.
velocity_controls:
  note: >-
    Distinct from rate limiting, Interchecks enforces per-account money-movement velocity and risk
    thresholds that surface as business errors rather than 429s.
  error_codes:
  - ERR_ACCOUNT_VELOCITY_LIMIT
  - ERR_ACCOUNT_LIMIT_EXCEEDED
  - ERR_ACCOUNT_SHARING_LIMIT_EXCEEDED
  - ERR_BANK_ACCOUNT_LIMIT
  - ERR_ACCOUNT_RISK_THRESHOLD
  - ERR_ACCOUNT_BALANCE_THRESHOLD
  note_values: >-
    The threshold values themselves are per-client configuration held by Interchecks and are not
    published; ACH Funding risk errors return a funding_options_response object carrying the
    configured threshold and the actual value at the time of the call.
