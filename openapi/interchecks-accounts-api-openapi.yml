                                  type: string
                                  example: USD
                                notes:
                                  type: string
                                  example: '2046862'
                                amount:
                                  type: integer
                                  example: 0
                                  default: 0
                                date:
                                  type: string
                                  example: '2022-07-22T10:25:23.510Z'
                - title: OK - Filter = CUSTOMER
                  type: object
                  properties:
                    account_summaries:
                      type: array
                      items:
                        type: object
                        properties:
                          account_last_four:
                            type: string
