         }\n            ]\n        }\n    ]\n}"
                OK - Filter = CUSTOMER:
                  value: "{\n    \"account_summaries\": [\n        {\n            \"account_last_four\": \"5586\",\n            \"account_transactions\": [\n                {\n                    \"systemTransactionId\": 1810005,\n                    \"activity\": \"New Card Activation\",\n                    \"reason\": \"Activation\",\n                    \"currency\": \"USD\",\n                    \"notes\": \"1810005\",\n                    \"amount\": 0.00,\n                    \"date\": \"2021-07-28T20:51:16.673Z\"\n                }\n            ]\n        }\n    ]\n}"
              schema:
                oneOf:
                - title: OK - Filter = ALL
                  type: object
                  properties:
                    account_summaries:
                      type: array
                      items:
                        type: object
                        properties:
                          account_last_four:
                            type: string
                            example: '5586'
                          account_transactions:
                            type: array
                            items:
                              type: object
                              properties:
                                systemTransactionId:
                                  type: integer
                                  example: 2046862
                                  default: 0
                                activity:
                                  type: string
                                  example: Activation Unlock
