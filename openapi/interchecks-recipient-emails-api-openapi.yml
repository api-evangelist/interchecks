          type: string
        primary:
          type: boolean
        invalid:
          type: boolean
      example:
        email: payee-123456@mailpoof.com
        primary: true
        invalid: false
    AddRecipientEmailRequest:
      title: AddRecipientEmailRequest
      required:
      - email
      - primary
      type: object
