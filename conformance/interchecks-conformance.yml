standards:
- id: oauth2
  conforms: true
  evidence: >-
    The published OpenAPI declares securityScheme sec0 as type oauth2 with a clientCredentials
    flow, and operation get-access-token exchanges HTTP Basic base64(clientId:secret) for an
    access_token / expires_in / token_type response with grant_type=client_credentials — RFC 6749
    section 4.4 shape, including the RFC 6749 invalid_client error response.
  source: openapi/interchecks-payments-api-v2.json#/paths/~1api~1v2~1oauth2~1token
- id: jwt
  conforms: true
  evidence: >-
    Access tokens are issued as JWTs (RFC 7519) and webhook payloads are signed with an RS256 JWT
    in the x-verification header carrying iat and request_body_sha256_hash.
  source: https://docs-v2.interchecks.com/docs/webhooks
- id: jwk
  conforms: true
  evidence: >-
    Both the webhook validation key endpoint and get-encryption-public-key return RSA keys in JSON
    Web Key form (kty, e, n) per RFC 7517; get-encryption-public-key also offers PEM.
  source: https://docs-v2.interchecks.com/docs/webhooks
- id: idempotency-key
  conforms: true
  evidence: >-
    Idempotency-Key is declared as an explicit header parameter on create-payment and
    create-transaction, with 409 for an already-processed match and 102 for one still in flight —
    the IETF HTTP API idempotency-key-header pattern, though Interchecks does not publish a key
    retention window.
  source: https://docs-v2.interchecks.com/reference/create-transaction
- id: rfc9457
  conforms: false
  evidence: >-
    Errors are returned as application/json with a custom {http_status, error_code, error_message}
    envelope. No application/problem+json media type, and none of type/title/detail/instance
    appear. The symbolic ERR_* code is the discriminator instead.
  source: errors/interchecks-problem-types.yml
- id: pagination
  conforms: false
  evidence: >-
    No pagination parameters, cursors or Link headers appear in any of the 68 published
    operations; collection reads are scoped to a single recipient and reports are bounded by date
