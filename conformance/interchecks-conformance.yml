domain_standards:
- id: nacha-ach
  label: NACHA ACH return reason codes
  conforms: true
  contract_evidence: >-
    The contract's error surface speaks NACHA natively: 22 ACH return reason codes (R01-R51) with
    their NACHA return timeframes are published as the failure vocabulary for ACH_FUNDING_PLUS,
    ACH_SAME_DAY, ACH_STANDARD and ACH_REFUND, and one of them is promoted into the API's own
    error registry as ERR_BANK_ACCOUNT_R03 ("R03: No Account/Unable to Locate Account"). Same-day
    processing is stated against the NACHA Same Day ACH 2:45PM Eastern window.
  spec_location: >-
    errors/interchecks-decline-codes.yml#ach_return_codes; error code ERR_BANK_ACCOUNT_R03 in
    https://docs-v2.interchecks.com/docs/api-error-codes
  source: https://docs-v2.interchecks.com/docs/ach-return-code
  buyer_impact: >-
    An integrator that already handles NACHA return codes needs no translation layer for ACH
    failures; the codes and their return windows arrive unmodified.
- id: card-network-action-codes
  label: Visa / Mastercard authorization response (action) codes
  conforms: true
  contract_evidence: >-
    Card declines return the network action code inside error_message as "<action code>:<message>"
    under ERR_OCT_DECLINE or ERR_AFT_DECLINE. 67 action codes are published, plus the network-split
    private-use range 76-89 documented separately for Visa and for Mastercard — the ISO 8583-derived
    response-code vocabulary passed through rather than remapped.
  spec_location: errors/interchecks-decline-codes.yml#card_declines
  source: https://docs-v2.interchecks.com/docs/instant-deposit-failure-codes
- id: visa-oct-aft
  label: Visa Original Credit Transaction / Account Funding Transaction
  conforms: true
  contract_evidence: >-
    OCT and AFT are first-class transaction methods in the contract — INSTANT_DEPOSIT (CREDIT, OCT)
    and INSTANT_FUNDING (DEBIT, AFT) — with dedicated OCT settlement and OCT transaction reporting
    operations (get-payer-oct-transactions-report, get-payer-oct-settlement-report) and documented
    partial-authorization and reversal semantics for AFT.
  spec_location: >-
    openapi/interchecks-payments-api-v2.json paths /api/v2/{payer_id}/reports/oct/transactions and
    /api/v2/{payer_id}/reports/oct/settlement
  source: https://docs-v2.interchecks.com/reference/about-transactions
- id: rtp
  label: The Clearing House Real-Time Payments
  conforms: partial
  contract_evidence: >-
    RTP is a published transaction method with a documented 30-second round trip and an rtp_status
    field in responses, and the sandbox publishes RTP-eligible routing numbers. The contract names
    the rail but exposes no ISO 20022 message identifiers or pacs.* structures, so conformance is
    at the product level, not the message level.
  spec_location: transaction method RTP; response field rtp_status
  source: https://docs-v2.interchecks.com/reference/about-transactions
- id: iso-20022
  label: ISO 20022
  conforms: false
  contract_evidence: >-
    No ISO 20022 message type, identifier or structure appears anywhere in the contract or the
    documentation, including on the RTP and ACH surfaces where it would be expected.
- id: psd2-sca
  label: PSD2 / Strong Customer Authentication
  conforms: false
  contract_evidence: >-
    Not applicable — Interchecks is a US-domestic payments provider (its own materials name
    sportsbooks, prediction markets, on-demand payroll, lenders, Fintechs and financial
    institutions in the US) and the contract exposes only US rails (ACH, RTP, US card OCT/AFT,
    paper check). No European regime surface is claimed.
- id: open-payments
  label: Open Payments / Open Banking API standard
  conforms: false
  contract_evidence: >-
    Bank data and authorization are obtained through Plaid rather than through an open-banking
    standard; the contract exposes Plaid processor tokens and Plaid Link, not an FDX or
    Open Banking surface.
