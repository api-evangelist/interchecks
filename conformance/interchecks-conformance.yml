compliance_note: >-
  Both certifications are stated as claims on marketing pages. Interchecks publishes no trust
  centre, no report request flow, no subprocessor list and no compliance page, so a buyer cannot
  retrieve the SOC 2 report or the PCI AOC without going through sales. There is also no
  security.txt and no vulnerability disclosure policy on any host.
in_contract_security_controls:
- control: Payload envelope encryption
  detail: >-
    Per-payer AES-GCM (or AES-CBC-PKCS5) payload encryption with RSA-OAEP SHA-256 / MGF1 SHA-256
    key wrapping, negotiated by the X-ENCRYPTED header, with a dedicated sandbox test harness and
    a public-key retrieval operation. This is a materially stronger transport-independent control
    than most payments APIs of this size publish.
  source: https://docs-v2.interchecks.com/docs/encrypted-requests
- control: Signed webhooks
  detail: RS256 JWT body-hash signature with published key rotation by kid and a 5-minute freshness rule.
  source: https://docs-v2.interchecks.com/docs/webhooks
- control: Compliance holds in the state machine
  detail: >-
    PENDING_KYC is a first-class transaction status ("under review by compliance team"), and
    APPROVAL_REQUIRED gates transactions on payer configuration — the AML/KYC posture is visible
    in the contract rather than hidden behind it.
  source: https://docs-v2.interchecks.com/reference/about-transactions
