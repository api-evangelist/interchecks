format: custom-json
rfc9457: false
note: 'Interchecks publishes a flat registry of symbolic ERR_* error codes returned in a custom JSON envelope.
  It is not RFC 9457 problem+json: the body is {http_status, error_code, error_message} with content-type
  application/json. Transaction errors may add a transaction_id, and ACH Funding risk errors add a funding_options_response
  object carrying the configured threshold and the actual value.'
envelope:
  fields:
    http_status: integer, mirrors the HTTP status
    error_code: string, an ERR_* symbol from the registry below
    error_message: string, human-readable description
  example:
    http_status: 422
    error_code: ERR_ACCOUNT_BALANCE_THRESHOLD
    error_message: Account balance insufficient
http_status_codes:
- status: 102
  meaning: Idempotent request is currently processing
- status: 200
  meaning: Request processed
- status: 201
  meaning: Request processed and entity created
- status: 400
  meaning: Bad request due to invalid or missing parameters
- status: 401
  meaning: Not Authenticated
- status: 403
  meaning: Not Authorized
- status: 404
  meaning: Resource or entity not found
- status: 405
  meaning: Method not implemented
- status: 409
  meaning: Request conflict, either with the Idempotency-Key or an active record was found
- status: 422
  meaning: Unprocessable request due to business logic or client configuration
- status: 429
  meaning: Too many requests in a given amount of time
- status: 500
  meaning: Unexpected error while processing the request
- status: 503
  meaning: Service unavailable, request timed out, or maintenance is underway
retry_guidance: A 5xx does not always mean the request failed — an error or timeout from a downstream
  provider can surface as 5xx. Interchecks recommends confirming whether the transaction has processed
  before retrying.
