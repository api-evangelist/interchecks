ach_return_codes:
  standard: NACHA ACH return reason codes
  note: ACH Funding and Payout transactions are processed through the Automated Clearing House and can
    be returned after the API call has already succeeded. The return surfaces as a FAILED transaction
    webhook. R01 returns on ACH_FUNDING_PLUS are automatically retried at a configured interval; ERR_ACH_RETRY_ATTEMPTS_EXHAUSTED
    is raised when retries run out.
  count: 22
  codes:
  - code: R01
    description: Insufficient Funds - The available and/or cash reserve balance is not sufficient to cover
      the dollar value of the debit entry.
    return_timeframe: 2 Banking Days
  - code: R02
    description: Account Closed - A previously active account has been closed by the customer or the RDFI.
    return_timeframe: 2 Banking Days
  - code: R03
    description: No Account/Unable to Locate Account - The account number structure is valid, but the
      account number does not exist or does not correspond to the individual identified in the entry.
    return_timeframe: 2 Banking Days
  - code: R04
    description: Invalid Account Number Structure - The account number structure is not valid.
    return_timeframe: 2 Banking Days
  - code: R05
    description: Unauthorized Debit to a Consumer Account - A CCD or CTX entry has been initiated to a
      consumer account and was not authorized by the Receiver.
    return_timeframe: 60 Calendars Days
  - code: R06
    description: Returned Per ODFIs Request - The ODFI has requested that the RDFI return an Erroneous
      Entry.
    return_timeframe: Undefined
  - code: R07
    description: Authorization Revoked - The Receiver revoked the authorization previously provided to
      the Originator for this debit entry.
    return_timeframe: 60 Calendar Days
  - code: R08
    description: Payment Stopped - The Receiver has placed a stop payment order on this entry.
    return_timeframe: 2 Banking Days
  - code: R09
    description: Uncollected Funds - Sufficient ledger balance exists to satisfy the dollar value of the
      transaction, but the available balance is below the dollar value of the debit entry.
    return_timeframe: 2 Banking Days
  - code: R10
    description: Customer Advises Not Authorized, Improper, Ineligible, or Part of an Incomplete Transaction
      - The RDFI has been notified by the Receiver that the Entry is unauthorized, improper, ineligible,
      or part of an incomplete transaction.
    return_timeframe: 60 Calendar Days
  - code: R11
    description: Customer Advises Entry Not in Accordance with the Terms of the Authorization
    return_timeframe: 60 Calendar Days
  - code: R12
    description: Account Sold to Another DFI - A financial institution received an Entry to an account
      that was sold to another financial institution.
    return_timeframe: 2 Banking Days
  - code: R13
    description: Invalid ACH Routing Number - An entry contains a routing number that is a not a valid
      ACH routing number.
    return_timeframe: 2 Banking Days
  - code: R16
    description: Account Frozen/Entry Returned Per OFAC Instruction - Access to the account is restricted
      due to specific action taken by the RDFI or by legal action
    return_timeframe: 2 Banking Days
  - code: R20
    description: Non-Transaction Account - The ACH entry destined for a non-transaction account as defined
      by Reg. D would include an account against which transactions are prohibited or limited.
    return_timeframe: 2 Banking Days
  - code: R21
    description: Invalid Company Identification - The identification number used in the Company ID Field
      is not valid. This Return Reason Code is generally used on CIE transactions.
    return_timeframe: 2 Banking Days
  - code: R22
    description: Invalid Individual ID - The Receiver has indicated to the RDFI that the number by which
      the Originator was identified is not correct. The Individual ID number of CIE or MTE entries is
      used by the Receiver to identify the account.
    return_timeframe: 2 Banking Days
  - code: R23
    description: Credit Entry Refused by Receiver - Any credit Entry that is refused by the Receiver may
      be returned by the RDFI.
    return_timeframe: 2 Calendar Days from Notice
  - code: R24
    description: Duplicate Entry - The RDFI has received what appears to be a duplicate entry, i.e. the
      trace number, date, dollar amount and/or other data matches another transaction.
    return_timeframe: 2 Banking Days
  - code: R29
    description: Corporate Customer Advises/Not Authorized - The Corporate Customer advises the entry
      is not authorized.
    return_timeframe: 2 Banking Days
  - code: R31
    description: Permissible Return Entry (CCD and CTX Entry) - The RDFI may return a CCD or CTX entry
      that the ODFI accept.
    return_timeframe: 2 Banking Days
  - code: R51
    description: Ineligible/Improper item
    return_timeframe: 60 Calendar Days
