card_declines:
  envelope_field: error_message
  envelope_format: '"<action code>:<message>"'
  error_codes:
  - ERR_OCT_DECLINE (Instant Deposit / payout)
  - ERR_AFT_DECLINE (Instant Funding / pull)
  http_status: 200
  note: Card declines are returned with HTTP 200, not a 4xx — the API call succeeded, the authorization
    did not. The network action code is embedded in error_message before the colon. Visa and Mastercard
    may return different text for the same action code; apart from codes 76-89 the response can be treated
    identically regardless of message.
  standard: ISO 8583 style network action/response codes as published by Visa and Mastercard
  masked_to_buyers: Not stated. The documentation does not say which codes are surfaced to the end recipient
    versus held for the payer.
  action_code_count: 67
