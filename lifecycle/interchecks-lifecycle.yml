sla:
  published: false
  note: >-
    No public SLA, uptime commitment or support-response target is published. Processing
    timelines are published per rail rather than as an availability commitment.
processing_timelines:
- rail: ACH_SAME_DAY / ACH_FUNDING_PLUS / ACH_REFUND
  commitment: Processed the same day when submitted before 2:45PM Eastern on a business day.
- rail: ACH_STANDARD
  commitment: Processed in 3-5 business days.
- rail: RTP
  commitment: Round trip may take up to 30 seconds; a webhook is sent when a definitive status is known.
- rail: INSTANT_DEPOSIT / INSTANT_FUNDING
  commitment: Immediate authorization; UNKNOWN or PROCESSING status may be returned on a network timeout.
support:
